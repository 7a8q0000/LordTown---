<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSB | محطة برباتوف</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #030202;
            --orange: #ff5500;
            --orange-glow: rgba(255, 85, 0, 0.6);
            --dark-orange: #3a1603;
            --text-main: #ff8c42;
            --alert-red: #ff003c;
            --scanline: rgba(255, 85, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Tajawal', 'Share Tech Mono', sans-serif;
            padding: 15px;
            direction: rtl;
            overflow-x: hidden;
            position: relative;
        }

        /* 📺 تأثير شاشة CRT وخطوط المسح */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* شاشة الإقلاع الوهمية */
        #boot-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--orange);
            transition: opacity 1s ease-out;
        }
        .boot-text { font-size: 1.4rem; font-weight: bold; text-shadow: 0 0 10px var(--orange); }
        .boot-spinner { margin-top: 20px; font-size: 2rem; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        /* تأثير السايبر بانك (الزوايا المقطوعة) */
        .cyber-box {
            background: rgba(10, 5, 2, 0.8);
            border: 1px solid var(--orange);
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            box-shadow: 0 0 15px var(--dark-orange);
            backdrop-filter: blur(5px);
        }

        .cyber-box::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; /* تم عكسها لتناسب اللغة العربية */
            border-bottom: 20px solid var(--orange);
            border-right: 20px solid transparent;
        }

        /* الهيدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--orange);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-family: 'Share Tech Mono', sans-serif;
            font-size: 1.5rem;
            color: var(--orange);
            text-shadow: 0 0 8px var(--orange);
            letter-spacing: 1px;
            margin: 0;
        }

        .btn-glitch {
            background: transparent;
            color: var(--orange);
            border: 1px solid var(--orange);
            padding: 5px 15px;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
            position: relative;
            transition: all 0.2s;
        }

        .btn-glitch:hover {
            background: var(--orange);
            color: var(--bg);
            box-shadow: 0 0 15px var(--orange);
        }

        /* زر التفعيل الكبير */
        .btn-activate {
            width: 100%;
            background: repeating-linear-gradient(45deg, var(--dark-orange), var(--dark-orange) 10px, transparent 10px, transparent 20px);
            border: 2px solid var(--orange);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 15px;
            cursor: pointer;
            text-shadow: 0 0 5px #000;
            transition: 0.3s;
            margin-bottom: 20px;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }
        .btn-activate:hover { background-color: var(--orange); box-shadow: 0 0 20px var(--orange); }

        /* شاشة العرض */
        .screen-display {
            background: #020101;
            border: 1px solid var(--dark-orange);
            min-height: 350px;
            max-height: 500px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }

        .msg-item {
            background: linear-gradient(270deg, rgba(255,85,0,0.1) 0%, transparent 100%);
            border-left: 3px solid var(--orange); /* خط الشاشة في اليمين/اليسار */
            border-right: none;
            padding: 12px;
            animation: slideIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            position: relative;
        }
        
        @keyframes slideIn {
            0% { transform: translateX(20px); opacity: 0; filter: blur(5px); }
            100% { transform: translateX(0); opacity: 1; filter: blur(0); }
        }

        .msg-meta { font-size: 0.75rem; color: #a55a30; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .msg-sender { color: var(--orange); font-weight: bold; letter-spacing: 1px; }
        .msg-body { font-size: 1.3rem; color: #fff; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 5px var(--orange-glow); font-family: 'Share Tech Mono', monospace;}

        /* المدخلات (Inputs) */
        input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--dark-orange);
            border-bottom: 2px solid var(--orange);
            color: var(--orange);
            padding: 12px;
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            margin-bottom: 12px;
            outline: none;
            transition: 0.3s;
        }
        input:focus { background: rgba(255,85,0,0.05); box-shadow: 0 0 10px var(--orange-glow); }

        /* نافذة الهاكر (Modal) */
        .modal-bg {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center;
            backdrop-filter: blur(8px);
        }
        .modal-box {
            background: #0a0502; border: 1px solid var(--alert-red);
            padding: 25px; width: 90%; max-width: 350px; text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.3);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }
        .modal-box h3 { color: var(--alert-red); margin-bottom: 15px; text-shadow: 0 0 5px var(--alert-red); }
        .modal-box input { border-color: var(--alert-red); color: var(--alert-red); text-align: center; font-size: 1.5rem; letter-spacing: 10px; font-family: 'Share Tech Mono';}
        
        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn-modal { flex: 1; padding: 10px; border: none; cursor: pointer; font-weight: bold; font-family: 'Tajawal'; }
        .btn-accept { background: var(--alert-red); color: #fff; }
        .btn-deny { background: transparent; border: 1px solid #555; color: #888; }
        
        .error-txt { color: var(--alert-red); font-size: 0.8rem; margin-top: 10px; display: none; animation: blink 0.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* لوحة المسؤولين */
        #adminPanel { display: none; margin-top: 20px; border-color: var(--alert-red); }
        #adminPanel::after { border-bottom-color: var(--alert-red); }
        #adminPanel h3 { color: var(--alert-red); font-size: 1.1rem; }
        
    </style>
</head>
<body>

<!-- شاشة الإقلاع (Boot Sequence) -->
<div id="boot-screen">
    <div class="boot-text" id="bootText">جاري تهيئة بروتوكول FSB الآمن...</div>
    <div class="boot-spinner">⚙</div>
</div>

<div class="container">
    <!-- الهيدر -->
    <div class="cyber-box">
        <div class="header">
            <h1>[ نظام_FSB ]</h1>
            <button class="btn-glitch" onclick="openAuth()">[ صلاحيات_المسؤول ]</button>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: #885533; font-weight: bold;">
            <span>حالة الشبكة: <span id="connStatus" style="color:var(--alert-red);">غير متصل</span></span>
            <span>القناة: SECURE_99</span>
        </div>
    </div>

    <!-- زر التفعيل -->
    <button id="connectBtn" class="btn-activate" onclick="initNetwork()">[ تهيئة الاتصال وتشغيل الإنذار ]</button>

    <!-- شاشة البيجر الرئيسية -->
    <div class="cyber-box" style="padding: 5px;">
        <div class="screen-display" id="pagerDisplay">
            <div style="text-align: center; color: #553322; margin-top: 120px; font-weight: bold; letter-spacing: 1px;">في انتظار استقبال الإشارات...</div>
        </div>
    </div>

    <!-- لوحة المسؤولين -->
    <div class="cyber-box" id="adminPanel">
        <h3 style="margin-bottom: 15px; border-bottom: 1px dashed var(--alert-red); padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center;">
            <span>[ بث مشفر ]</span>
            <button onclick="closeAdmin()" style="background:none; border:none; color:#666; cursor:pointer; font-weight: bold;">[إغلاق]</button>
        </h3>
        <input type="text" id="senderName" value="برباتوف" placeholder="معرف المرسل (الاسم)">
        <input type="text" id="cipherText" placeholder="أدخل الشفرة (مثال: 24-28-25-1)">
        <button class="btn-activate" style="background:var(--alert-red); border-color:#fff; margin-bottom: 0;" onclick="sendCipher()">[ إرسال الإشارة ]</button>
    </div>

</div>

<!-- نافذة الاختراق / تسجيل الدخول -->
<div class="modal-bg" id="authModal">
    <div class="modal-box">
        <h3>الوصول مقيد للقيادة</h3>
        <input type="password" id="pinInput" placeholder="****" maxlength="4" onkeydown="if(event.key==='Enter') verifyPin()">
        <div class="error-txt" id="pinError">تم الرفض - الرمز السري غير صالح</div>
        <div class="btn-row">
            <button class="btn-modal btn-accept" onclick="verifyPin()">فك التشفير والدخول</button>
            <button class="btn-modal btn-deny" onclick="closeAuth()">إلغاء</button>
        </div>
    </div>
</div>

<script>
    // --- شاشة الإقلاع الوهمية ---
    window.onload = () => {
        let texts = ["جاري إنشاء اتصال مشفر...", "جاري تخطي جدران الحماية...", "جاري فك تشفير البروتوكولات...", "النظام جاهز للاستخدام."];
        let idx = 0;
        let bootInt = setInterval(() => {
            idx++;
            if(idx < texts.length) {
                document.getElementById('bootText').innerText = texts[idx];
            } else {
                clearInterval(bootInt);
                document.getElementById('boot-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('boot-screen').style.display = 'none', 1000);
            }
        }, 700);
    };

    // --- إعدادات الشبكة ---
    const ADMIN_PIN = "7777";
    const SECRET_CHANNEL = "lordtown_fsb_cyber_v1_ar";
    let client;
    let isConnected = false;
    let audioCtx;

    function initNetwork() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const btn = document.getElementById('connectBtn');
        btn.innerText = "[ تم الاتصال بالشبكة بنجاح ]";
        btn.style.background = "var(--orange)";
        btn.style.color = "#000";
        document.getElementById('connStatus').innerText = "متصل";
        document.getElementById('connStatus').style.color = "var(--orange)";

        const clientID = "fsb_cyber_" + Math.random().toString(16).substr(2, 8);
        client = new Paho.MQTT.Client("broker.hivemq.com", 8884, clientID);
        client.onConnectionLost = () => { isConnected = false; document.getElementById('connStatus').innerText = "غير متصل"; document.getElementById('connStatus').style.color = "var(--alert-red)"; setTimeout(initNetwork, 3000); };
        client.onMessageArrived = onMessageArrived;
        client.connect({ onSuccess: () => { isConnected = true; client.subscribe(SECRET_CHANNEL); }, useSSL: true });
    }

    // --- نظام تسجيل الدخول ---
    function openAuth() { 
        document.getElementById('pinInput').value = ""; 
        document.getElementById('pinError').style.display = "none";
        document.getElementById('authModal').style.display = "flex"; 
        document.getElementById('pinInput').focus();
    }
    function closeAuth() { document.getElementById('authModal').style.display = "none"; }
    
    function verifyPin() {
        if (document.getElementById('pinInput').value === ADMIN_PIN) {
            closeAuth();
            const panel = document.getElementById('adminPanel');
            panel.style.display = "block";
            panel.scrollIntoView({ behavior: 'smooth' });
        } else {
            document.getElementById('pinError').style.display = "block";
            document.getElementById('pinInput').value = "";
        }
    }
    function closeAdmin() { document.getElementById('adminPanel').style.display = "none"; }

    // --- إرسال واستقبال الشفرات ---
    function sendCipher() {
        if (!isConnected) return alert("النظام غير متصل. يرجى الضغط على زر تهيئة الاتصال أولاً.");
        const sender = document.getElementById('senderName').value || "مجهول";
        const code = document.getElementById('cipherText').value;
        if (!code) return;

        const payload = JSON.stringify({
            sender: sender, code: code,
            time: new Date().toLocaleTimeString('ar-SA', { hour12: false })
        });
        const msg = new Paho.MQTT.Message(payload);
        msg.destinationName = SECRET_CHANNEL;
        client.send(msg);
        document.getElementById('cipherText').value = "";
    }

    function onMessageArrived(msg) {
        const data = JSON.parse(msg.payloadString);
        playCyberBeep();

        const display = document.getElementById('pagerDisplay');
        if (display.innerHTML.includes("في انتظار استقبال الإشارات")) display.innerHTML = "";

        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg-item';
        msgDiv.innerHTML = `
            <div class="msg-meta">
                <span class="msg-sender">[ ${data.sender} ] // مفكوك التشفير</span>
                <span style="font-family: 'Share Tech Mono';">T-${data.time}</span>
            </div>
            <div class="msg-body">${data.code}</div>
        `;
        
        display.prepend(msgDiv); // يضيف الرسالة في الأعلى
    }

    // --- صوت السايبربانك (حاد ومستقبلي) ---
    function playCyberBeep() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } catch (e) { console.log(e); }
    }
</script>
</body>
</html>
